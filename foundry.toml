[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules", "lib"]
solc = "0.8.28"
optimizer = true
via_ir = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./evidence" }]
remappings = [
  "@gluwa/=node_modules/@gluwa/",
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=lib/forge-std/src/",
]
